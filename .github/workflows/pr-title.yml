name: PR title

# Pull requests are squash-merged with their title as the commit message, and release-please reads that message to sort the release
# notes. The title therefore has to be a Conventional Commit: type(scope): subject, with ! before the colon for a breaking change.
# In the merge queue the job is skipped, which counts as passed for a required check.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
  merge_group:

permissions:
  pull-requests: read

jobs:
  title:
    if: ${{ github.event_name == 'pull_request_target' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: amannn/action-semantic-pull-request@0723387faaf9b38adef4775cd42cfd5155ed6017 # v5.5.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            revert
            refactor
            docs
            copy
            style
            test
            build
            ci
            chore
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: The subject "{subject}" must start with a lowercase letter.

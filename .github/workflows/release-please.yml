name: Release PR

# Keeps one open pull request on master that bumps the version in package.json and package-lock.json. Merging it creates the
# v* tag and the GitHub release with the notes sorted by commit type; the tag starts release.yml, which attaches the packages.
# It runs with CI_PUSH_TOKEN: tags and pull requests made by GITHUB_TOKEN start no workflows, so the checks and the build would never run.
on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.CI_PUSH_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # The release PR only bumps the version and changelog, so it never carries a real UI change, but its visual job still
      # diffs against master's baseline, which the merge that triggered this run rebuilds in parallel (visual-baseline.yml).
      # The two race, so the job can compare against the old baseline and fail. The `ui` label skips visual the same way it
      # does on a source PR. CI_PUSH_TOKEN so the labeled event starts a fresh CI run (a GITHUB_TOKEN edit starts none).
      - name: Skip visual on the release PR
        if: ${{ steps.release.outputs.pr }}
        env:
          GH_TOKEN: ${{ secrets.CI_PUSH_TOKEN }}
          PR: ${{ fromJSON(steps.release.outputs.pr).number }}
        run: gh pr edit "$PR" --add-label ui

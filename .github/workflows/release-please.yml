name: Release PR

# Keeps one open pull request on master that bumps the version in package.json and package-lock.json. Merging it creates the
# v* tag and the GitHub release with the notes sorted by commit type; the tag starts release.yml, which attaches the packages.
# It runs with CI_PUSH_TOKEN: tags and pull requests made by GITHUB_TOKEN start no workflows, so the checks and the build would never run.
on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          token: ${{ secrets.CI_PUSH_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

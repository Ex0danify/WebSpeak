name: Build release assets

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
        type: string

permissions:
  contents: read

jobs:
  windows-x64:
    uses: ./.github/workflows/build-windows.yml
    with:
      version: ${{ inputs.version || github.ref_name }}
      upload: true

  linux-x64:
    uses: ./.github/workflows/build-linux.yml
    with:
      version: ${{ inputs.version || github.ref_name }}
      upload: true

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-x64, linux-x64]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write # mint the provenance attestation
      attestations: write
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - name: Download deployment packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*-x64'
          path: release-assets
          merge-multiple: true
      - name: Checksums
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum *-x64.* > SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*-x64.*
      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          name: WebSpeak ${{ github.ref_name }}
          files: |
            release-assets/*-x64.*
            release-assets/SHA256SUMS

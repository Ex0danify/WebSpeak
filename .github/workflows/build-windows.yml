name: Build Windows x64

# The Windows build, test and packaged smoke test, shared by the release workflow (upload: true) and the PR
# gate in ci.yml (upload: false). With no version input it builds the current package.json version in place.
on:
  workflow_call:
    inputs:
      version:
        description: Release version, with or without the v prefix; defaults to the package.json version
        required: false
        type: string
        default: ""
      upload:
        description: Upload the packaged zip as a build artifact
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    # harden-runner is Linux-only, so the Windows job runs without egress control.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - name: Audit shipped dependencies
        shell: pwsh
        run: npm run audit:ci
      - name: Build application
        shell: pwsh
        env:
          RELEASE_REF: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrEmpty($env:RELEASE_REF)) {
            $releaseVersion = node -p "require('./package.json').version"
          } else {
            $releaseVersion = $env:RELEASE_REF -replace '^v', ''
          }
          "RELEASE_VERSION=$releaseVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix web ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $currentVersion = node -p "require('./package.json').version"
          if ($currentVersion -ne $releaseVersion) {
            npm version --no-git-tag-version $releaseVersion
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test -- --maxWorkers=4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm prune --omit=dev --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Failed tests on the run summary
        if: ${{ !cancelled() }}
        run: node scripts/ci-summary.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: windows-test-results
          path: test-results/
          if-no-files-found: ignore
      - name: Package and smoke-test Windows x64
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $releaseVersion = $env:RELEASE_VERSION
          $packageName = "webspeak-webclient-v$releaseVersion-windows-x64"
          $packageRoot = Join-Path $env:RUNNER_TEMP $packageName
          $runtimeRoot = Split-Path -Parent (Get-Command node).Source
          New-Item -ItemType Directory -Path $packageRoot | Out-Null
          Copy-Item -Recurse -LiteralPath dist -Destination $packageRoot
          New-Item -ItemType Directory -Path (Join-Path $packageRoot "web") | Out-Null
          Copy-Item -Recurse -LiteralPath web/dist -Destination (Join-Path $packageRoot "web")
          Copy-Item -Recurse -LiteralPath node_modules -Destination $packageRoot
          Copy-Item -LiteralPath .env.example,README.md,LICENSE,package.json,package-lock.json -Destination $packageRoot
          New-Item -ItemType Directory -Path (Join-Path $packageRoot "runtime") | Out-Null
          Copy-Item -LiteralPath (Join-Path $runtimeRoot "node.exe") -Destination (Join-Path $packageRoot "runtime")
          Copy-Item -LiteralPath (Join-Path $runtimeRoot "LICENSE") -Destination (Join-Path $packageRoot "runtime/NODE-LICENSE")
          @'
          @echo off
          setlocal
          cd /d "%~dp0"
          "%~dp0runtime\node.exe" "%~dp0dist\index.js"
          if errorlevel 1 (
            echo.
            echo WebSpeak stopped with an error. Check data\logs for details.
            pause
          )
          '@ | Set-Content -LiteralPath (Join-Path $packageRoot "start-webspeak.cmd") -Encoding ascii

          $smokeRoot = Join-Path $env:RUNNER_TEMP ($packageName + "-smoke")
          Copy-Item -Recurse -LiteralPath $packageRoot -Destination $smokeRoot
          Copy-Item -LiteralPath (Join-Path $smokeRoot ".env.example") -Destination (Join-Path $smokeRoot ".env")
          $env:WEBSPEAK_ADMIN_PASSWORD = "release-smoke-test-password"
          $process = $null
          try {
            $process = Start-Process -FilePath (Join-Path $smokeRoot "runtime/node.exe") -ArgumentList "dist/index.js" -WorkingDirectory $smokeRoot -WindowStyle Hidden -PassThru
            $health = $null
            for ($attempt = 0; $attempt -lt 30 -and -not $health; $attempt++) {
              Start-Sleep -Milliseconds 500
              try { $health = Invoke-RestMethod -Uri "http://127.0.0.1:3040/api/health" -TimeoutSec 2 } catch {}
            }
            if (-not $health -or $health.status -ne "ok" -or $health.version -ne $releaseVersion) {
              throw "Windows release health check failed"
            }
          } finally {
            if ($process -and -not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
          Compress-Archive -LiteralPath $packageRoot -DestinationPath (Join-Path $env:GITHUB_WORKSPACE ($packageName + ".zip")) -CompressionLevel Optimal
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ inputs.upload }}
        with:
          name: windows-x64
          path: webspeak-webclient-v*-windows-x64.zip
          if-no-files-found: error
          compression-level: 0

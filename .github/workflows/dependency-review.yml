name: Dependency review

# Flags dependencies a pull request adds that carry a known advisory. Advisory for now (warn-only, not part of ci-pass):
# it comments on the PR without blocking. Drop warn-only to turn it into a gate.
on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          warn-only: true
          comment-summary-in-pr: on-failure

name: CI

# The required check is `ci-pass`. Together the jobs cover `npm run test:full` plus format, lint and a packaged build on each target platform.
# Add the label `ui-change` to a pull request that changes the look on purpose: the visual job is skipped, and the baseline is
# rebuilt after the merge (visual-baseline.yml). The format job commits Prettier fixes to the branch first.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Runs Prettier on the pull request's branch and pushes a commit if anything changed. That push starts a new run (it needs
  # the CI_PUSH_TOKEN secret: a push by GITHUB_TOKEN starts no workflow, so the new head would never get its checks), and this
  # run stops here. Skipped for pull requests from forks and in the merge queue, where verify's format:check still guards.
  format:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.CI_PUSH_TOKEN }}
      - uses: ./.github/actions/setup
      - run: npm run format
      - id: commit
        run: |
          git add -A
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format with Prettier"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # Static checks only. The build and unit tests run on each target platform in linux-build and windows-build.
  verify:
    needs: format
    if: ${{ !cancelled() && needs.format.result != 'failure' && needs.format.outputs.changed != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run format:check
      - run: npm run lint

  e2e:
    needs: format
    if: ${{ !cancelled() && needs.format.result != 'failure' && needs.format.outputs.changed != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npx playwright install --with-deps chromium
      - run: npm run build:web
      - run: npm run test:e2e -- --workers=2
      # The a11y suite still runs after an e2e failure, so one red suite does not hide the other.
      - run: npm run test:a11y -- --workers=2
        if: ${{ !cancelled() }}
      - name: Failed tests on the run summary
        if: ${{ !cancelled() }}
        run: node scripts/ci-summary.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-test-results
          path: test-results/
          if-no-files-found: ignore

  # Screenshots against the baseline committed on master (e2e/visual/baseline), made on this same runner image.
  visual:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ui') }}
    runs-on: ubuntu-latest
    env:
      WEBSPEAK_VISUAL_BASELINE: ${{ github.workspace }}/e2e/visual/baseline
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npx playwright install --with-deps chromium
      - run: npm run build:web
      - name: Compare screenshots
        run: |
          if ! ls e2e/visual/baseline/*.png >/dev/null 2>&1; then
            echo "::warning::No baseline on master yet, visual check skipped. visual-baseline.yml creates it after the next merge."
            exit 0
          fi
          npm run test:visual
      - name: Failed tests on the run summary
        if: ${{ !cancelled() }}
        run: node scripts/ci-summary.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diff
          path: test-results/visual/
          if-no-files-found: ignore

  # Fails the merge when a shipped dependency has a high or critical advisory, so nothing vulnerable reaches master.
  security-audit:
    needs: format
    if: ${{ !cancelled() && needs.format.result != 'failure' && needs.format.outputs.changed != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run audit:ci

  # Each target platform builds, tests, packages and boots its artifact on its own runner, without uploading it, so a
  # platform-specific build or runtime break is caught at PR time rather than at release (release.yml shares the scripts).
  linux-build:
    needs: format
    if: ${{ !cancelled() && needs.format.result != 'failure' && needs.format.outputs.changed != 'true' }}
    uses: ./.github/workflows/build-linux.yml

  windows-build:
    needs: format
    if: ${{ !cancelled() && needs.format.result != 'failure' && needs.format.outputs.changed != 'true' }}
    uses: ./.github/workflows/build-windows.yml

  docker-smoke:
    needs: format
    if: ${{ !cancelled() && needs.format.result != 'failure' && needs.format.outputs.changed != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build --tag webspeak:ci .
      - name: Health smoke test
        run: |
          set -euo pipefail
          docker run --detach --name webspeak-ci --publish 3040:3040 --env-file .env.example --env WEBSPEAK_DATA_DIR=/data --env WEBSPEAK_ADMIN_PASSWORD=ci-smoke-test-password webspeak:ci
          trap 'docker logs webspeak-ci; docker rm --force webspeak-ci' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3040/api/health | grep -q '"status":"ok"'; then exit 0; fi
            sleep 2
          done
          exit 1

  # The one status to require in the branch protection. A skipped visual job (label ui) counts as passed.
  ci-pass:
    if: always()
    needs: [format, verify, e2e, visual, docker-smoke, security-audit, linux-build, windows-build]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo '${{ toJSON(needs) }}'
          if echo '${{ join(needs.*.result, ' ') }}' | grep -qE 'failure|cancelled'; then exit 1; fi

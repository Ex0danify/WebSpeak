name: Feature request
description: Propose a specific, actionable change to WebSpeak
labels: ["feature-request"]
body:
  - type: markdown
    attributes:
      value: |
        For rough ideas that are not yet a concrete proposal, start in [Discussions → Ideas](https://github.com/Ex0danify/WebSpeak/discussions/categories/ideas). Open a feature request once you can describe what should change.

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part would this affect? Pick "Not sure" if you cannot tell.
      options:
        - Web UI (the browser app)
        - Gateway (the Node server)
        - Relay / acceleration
        - Not sure
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What are you trying to do, and what makes it hard today? Describe the need, not only the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should WebSpeak do? Describe the behavior from a user's point of view.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or existing workarounds, and why they fall short.

  - type: textarea
    id: accessibility
    attributes:
      label: Accessibility considerations
      description: Any impact on keyboard navigation, screen readers, contrast, touch target sizes, or motion. Write "None expected" if you cannot think of any.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, links, related issues, or anything else that helps.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and discussions and this is not a duplicate.
          required: true

services:
  webspeak:
    # No published image yet, so Compose builds it from the Dockerfile.
    build: .
    restart: unless-stopped
    user: "${WEBSPEAK_UID:?}:${WEBSPEAK_GID:?}"
    # WebSpeak needs to reach a TeamSpeak server running on the same host.
    # Host networking also exposes the configured WebRTC UDP range directly.
    network_mode: host
    # Compose refuses to start without the file, and WebSpeak without any of its variables.
    env_file: .env
    environment:
      # Inside the container the data is always /data. WEBSPEAK_DATA_DIR from .env is the host folder mounted there.
      WEBSPEAK_DATA_DIR: /data
    volumes:
      - ${WEBSPEAK_DATA_DIR:?}:/data
